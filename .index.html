<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מחשבון מים - שה"מ 2024</title>
    
    <!-- PWA Setup -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1d4ed8">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #f8fafc; }
        .card { @apply bg-white rounded-3xl shadow-sm border border-slate-100 p-5; }
        .btn-ratio { @apply flex-1 py-3 rounded-2xl border border-slate-200 font-bold text-slate-500 bg-white transition-all; }
        .btn-ratio.active { @apply bg-blue-700 text-white border-blue-700 shadow-lg scale-105; }
        input[type="range"] { @apply w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-700; }
    </style>
</head>
<body class="pb-10">

    <div class="max-w-md mx-auto p-4 space-y-4">
        <!-- Header -->
        <div class="flex items-center justify-between py-2">
            <div class="flex items-center gap-3">
                <div class="bg-blue-700 p-2.5 rounded-2xl text-white">
                    <i data-lucide="droplets"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-800 leading-none">מחשבון מים</h1>
                    <p class="text-[10px] text-blue-600 font-bold mt-1 uppercase">טבלת שה"מ 2024</p>
                </div>
            </div>
        </div>

        <!-- Day Selection -->
        <div class="card">
            <div class="flex justify-between items-end mb-4">
                <span class="text-slate-500 text-sm font-semibold">יום גידול</span>
                <div class="flex items-baseline gap-1">
                    <span class="text-4xl font-black text-blue-700" id="day-display">1</span>
                    <span class="text-slate-400 text-xs font-bold">ימים</span>
                </div>
            </div>
            <input type="range" id="day-slider" min="1" max="56" value="1">
        </div>

        <!-- Ratio Selection -->
        <div class="card">
            <p class="text-[11px] font-bold text-slate-400 uppercase mb-3 text-center">יחס מים/מזון להשוואה</p>
            <div class="flex gap-2">
                <button onclick="setRatio(1.6)" id="r16" class="btn-ratio">1.6</button>
                <button onclick="setRatio(2.0)" id="r20" class="btn-ratio active">2.0</button>
                <button onclick="setRatio(2.5)" id="r25" class="btn-ratio">2.5</button>
            </div>
        </div>

        <!-- Actual Input -->
        <div class="card bg-blue-700 border-none shadow-xl shadow-blue-100">
            <label class="block text-white text-center text-sm font-bold mb-2 opacity-80">צריכה בפועל (מ"ל לראש)</label>
            <input type="number" id="actual-input" inputmode="decimal" placeholder="הזן ערך..."
                   class="w-full p-4 bg-white/10 border border-white/20 rounded-2xl text-center text-4xl font-black text-white outline-none focus:bg-white/20 placeholder:text-white/30">
        </div>

        <!-- Result Card -->
        <div id="result-area" class="hidden space-y-4 animate-in fade-in duration-500">
            <div id="status-banner" class="p-4 rounded-3xl flex items-center gap-4 border-2">
                <div id="status-icon" class="p-2 rounded-xl"></div>
                <p id="status-text" class="font-bold text-sm leading-snug"></p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="card flex flex-col items-center justify-center py-6">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">יעד טבלה</p>
                    <p class="text-2xl font-black text-slate-800" id="target-display">-</p>
                </div>
                <div class="card flex flex-col items-center justify-center py-6">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">סטייה</p>
                    <p class="text-2xl font-black" id="diff-display">-</p>
                </div>
            </div>
        </div>

        <!-- Chart -->
        <div class="card">
            <canvas id="chart" height="150"></canvas>
        </div>

        <footer class="text-center opacity-30 pt-4">
            <p class="text-[10px] font-bold">מבוסס על נתוני נבות חקלאי, שה"מ 2024</p>
        </footer>
    </div>

    <script>
        const table = [
            {d:1,f:18.2,w16:29.2,w20:36.5,w25:45.6}, {d:2,f:21.5,w16:34.4,w20:43.0,w25:53.7},
            {d:3,f:25.1,w16:40.1,w20:50.2,w25:62.7}, {d:4,f:29.0,w16:46.5,w20:58.1,w25:72.6},
            {d:5,f:33.3,w16:53.3,w20:66.7,w25:83.3}, {d:6,f:38.0,w16:60.7,w20:75.9,w25:94.9},
            {d:7,f:42.9,w16:68.6,w20:85.8,w25:107.2}, {d:8,f:48.1,w16:77.0,w20:96.2,w25:120.3},
            {d:9,f:51.9,w16:83.1,w20:103.8,w25:129.8}, {d:10,f:57.5,w16:91.9,w20:114.9,w25:143.7},
            {d:11,f:63.2,w16:101.1,w20:126.4,w25:158.0}, {d:12,f:69.1,w16:110.6,w20:138.2,w25:172.8},
            {d:13,f:75.1,w16:120.2,w20:150.3,w25:187.8}, {d:14,f:81.3,w16:130.0,w20:162.5,w25:203.1},
            {d:15,f:87.4,w16:139.9,w20:174.8,w25:218.6}, {d:16,f:93.6,w16:149.8,w20:187.2,w25:234.0},
            {d:17,f:99.8,w16:159.6,w20:199.5,w25:249.4}, {d:18,f:105.9,w16:169.4,w20:211.7,w25:264.7},
            {d:19,f:111.9,w16:179.0,w20:223.8,w25:279.7}, {d:20,f:117.8,w16:188.5,w20:235.6,w25:294.5},
            {d:21,f:123.6,w16:197.7,w20:247.2,w25:308.9}, {d:22,f:129.2,w16:206.7,w20:258.4,w25:323.0},
            {d:23,f:134.6,w16:215.4,w20:269.2,w25:336.5}, {d:24,f:139.8,w16:223.7,w20:279.7,w25:349.6},
            {d:25,f:144.8,w16:231.7,w20:289.7,w25:362.1}, {d:26,f:149.6,w16:239.4,w20:299.3,w25:374.1},
            {d:27,f:154.2,w16:246.7,w20:308.4,w25:385.5}, {d:28,f:158.5,w16:253.6,w20:317.0,w25:396.3},
            {d:29,f:162.6,w16:260.1,w20:325.1,w25:406.4}, {d:30,f:166.4,w16:266.2,w20:332.8,w25:416.0},
            {d:31,f:170.0,w16:272.0,w20:340.0,w25:425.0}, {d:32,f:173.3,w16:277.4,w20:346.7,w25:433.4},
            {d:33,f:176.5,w16:282.3,w20:352.9,w25:441.2}, {d:34,f:179.4,w16:287.0,w20:358.7,w25:448.4},
            {d:35,f:182.0,w16:291.2,w20:364.1,w25:455.1}, {d:36,f:184.5,w16:295.2,w20:369.0,w25:461.2},
            {d:37,f:186.7,w16:298.8,w20:373.5,w25:466.9}, {d:38,f:188.8,w16:302.1,w20:377.6,w25:472.0},
            {d:39,f:190.7,w16:305.1,w20:381.3,w25:476.7}, {d:40,f:192.4,w16:307.8,w20:384.7,w25:480.9},
            {d:41,f:193.9,w16:310.2,w20:387.8,w25:484.7}, {d:42,f:195.3,w16:312.4,w20:390.5,w25:488.2},
            {d:43,f:196.5,w16:314.4,w20:393.0,w25:491.3}, {d:44,f:197.6,w16:316.2,w20:395.2,w25:494.0},
            {d:45,f:198.6,w16:317.7,w20:397.1,w25:496.4}, {d:46,f:199.4,w16:319.1,w20:398.8,w25:498.5},
            {d:47,f:200.2,w16:320.2,w20:400.3,w25:500.4}, {d:48,f:200.8,w16:321.3,w20:401.6,w25:502.0},
            {d:49,f:201.3,w16:322.2,w20:402.7,w25:503.4}, {d:50,f:201.8,w16:322.9,w20:403.6,w25:504.5},
            {d:51,f:202.2,w16:323.5,w20:404.4,w25:505.5}, {d:52,f:202.5,w16:324.0,w20:405.0,w25:506.3},
            {d:53,f:202.8,w16:324.4,w20:405.6,w25:506.9}, {d:54,f:203.0,w16:324.8,w20:406.0,w25:507.4},
            {d:55,f:203.1,w16:325.0,w20:406.3,w25:507.8}, {d:56,f:203.2,w16:325.2,w20:406.5,w25:508.1}
        ];

        let selectedRatio = 2.0;
        let myChart;

        function setRatio(r) {
            selectedRatio = r;
            document.querySelectorAll('.btn-ratio').forEach(b => b.classList.remove('active'));
            document.getElementById('r' + r.toString().replace('.','')).classList.add('active');
            update();
        }

        function update() {
            const day = parseInt(document.getElementById('day-slider').value);
            const row = table[day-1];
            document.getElementById('day-display').textContent = day;

            const target = selectedRatio === 1.6 ? row.w16 : (selectedRatio === 2.0 ? row.w20 : row.w25);
            document.getElementById('target-display').textContent = target.toFixed(1);

            const actual = parseFloat(document.getElementById('actual-input').value);
            const area = document.getElementById('result-area');

            if (actual > 0) {
                area.classList.remove('hidden');
                const diff = ((actual - target) / target) * 100;
                const diffEl = document.getElementById('diff-display');
                diffEl.textContent = (diff > 0 ? '+' : '') + diff.toFixed(1) + '%';
                diffEl.style.color = Math.abs(diff) > 10 ? '#ef4444' : '#10b981';

                const currentRatio = actual / row.f;
                const banner = document.getElementById('status-banner');
                const text = document.getElementById('status-text');
                const icon = document.getElementById('status-icon');

                if (currentRatio < 1.6) {
                    banner.className = "p-4 rounded-3xl flex items-center gap-4 border-2 bg-red-50 border-red-200 text-red-700";
                    text.innerHTML = "אזהרה: יחס נמוך (< 1.6)<br><span class='font-normal text-xs opacity-75'>חשד למחלה או תקלה בתערובת</span>";
                    icon.innerHTML = '<i data-lucide="alert-circle"></i>';
                } else if (currentRatio > 2.5) {
                    banner.className = "p-4 rounded-3xl flex items-center gap-4 border-2 bg-orange-50 border-orange-200 text-orange-700";
                    text.innerHTML = "אזהרה: יחס גבוה (> 2.5)<br><span class='font-normal text-xs opacity-75'>חשד לנזילות מים או תקלה בפטמות</span>";
                    icon.innerHTML = '<i data-lucide="droplets"></i>';
                } else {
                    banner.className = "p-4 rounded-3xl flex items-center gap-4 border-2 bg-emerald-50 border-emerald-200 text-emerald-700";
                    text.innerHTML = "צריכה תקינה<br><span class='font-normal text-xs opacity-75'>הלהקה בטווח הנורמה של שה\"מ</span>";
                    icon.innerHTML = '<i data-lucide="check-circle-2"></i>';
                }
                lucide.createIcons();
            } else {
                area.classList.add('hidden');
            }
            updateChart(day);
        }

        function initChart() {
            const ctx = document.getElementById('chart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: table.map(t => t.d),
                    datasets: [{
                        data: table.map(t => t.w20),
                        borderColor: '#cbd5e1',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: false,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false }, y: { display: false } }
                }
            });
        }

        function updateChart(day) {
            myChart.data.datasets[0].pointRadius = table.map((_, i) => i === day-1 ? 6 : 0);
            myChart.data.datasets[0].pointBackgroundColor = '#1d4ed8';
            myChart.update('none');
        }

        document.getElementById('day-slider').oninput = update;
        document.getElementById('actual-input').oninput = update;
        window.onload = () => { initChart(); update(); lucide.createIcons(); };
    </script>
</body>
</html>
